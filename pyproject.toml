[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-agent"
version = "2.1.0"
description = "金融智能投顾系统 —— 基于多 Agent 的 A 股投资顾问"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Finance Agent Team"}
]
keywords = ["finance", "investment", "multi-agent", "langgraph", "a-shares"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "langchain",
    "langgraph",
    "langgraph-checkpoint-postgres",
    "psycopg[binary]>=3.1",
    "psycopg-pool",
    "langchain-community",
    "langchain-deepseek",
    "python-dotenv",
    "redis",
    "fastapi",
    "uvicorn[standard]",
    "pandas",
    "numpy",
    "pydantic",
    "requests",
    "mcp>=1.0.0",
    "httpx2>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio",
    "httpx",
]
# 本地股票数据源（AKShare / BaoStock）；Tushare 走 MCP，无需额外安装。
providers = [
    "akshare>=1.10.0",
    "baostock>=0.8.8",
]
[tool.setuptools.packages.find]
include = ["finance_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "network: 需要真实第三方接口的冒烟测试（默认跳过，设置 RUN_NETWORK_TESTS=1 启用）",
]
