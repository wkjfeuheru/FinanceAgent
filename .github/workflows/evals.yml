name: evals

# 编排层评测与基线回归。评测全部离线（内存桩替代模型与数据源），无需外部服务，
# 因此可以直接在标准 GitHub Actions runner 上跑，用来拦住「加固能力退化」的提交。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 意图路由评测 + 并发基准 + 故障注入
        run: python -m evals.run_all

      - name: 基线回归校验（跌破阈值即失败）
        run: python -m evals.check_baseline

      - name: 上传评测结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/*.json
          if-no-files-found: warn

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 运行测试
        run: python -m pytest -q
        env:
          DEEPSEEK_API_KEY: test-key
          REDIS_URL: redis://localhost:6379/15
